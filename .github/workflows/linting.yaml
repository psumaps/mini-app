name: Linting

on:
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci && npm ci --prefix shared && npm ci --prefix web
      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.{js,jsx,ts,tsx,css,md,yml,yaml,json}

      - name: Echo changed files
        run: |
          echo Files: ${{ steps.changed.outputs.all_changed_files }}

      - name: Prettier (write)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          npx prettier --config ./.prettierrc.js ${{ steps.changed.outputs.all_changed_files }} --write

      - name: ESLint (fix)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          npx eslint --config ./eslint.config.js ${{ steps.changed.outputs.all_changed_files }} --max-warnings=0 --fix

      - name: Commit changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Optional. Commit message for the created commit.
          # Defaults to "Apply automatic changes"
          commit_message: 'refactor: apply formating'

          # Optional. Options used by `git-commit`.
          # See https://git-scm.com/docs/git-commit#_options
          commit_options: '--no-verify --signoff'
          # Optional commit user and author settings
          commit_author: Actions <actions@github.com> # defaults to "username <username@users.noreply.github.com>", where "username" belongs to the author of the commit that triggered the run
