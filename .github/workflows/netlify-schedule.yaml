# Rebuild Netlify previews for all open PRs twice a month
name: Refresh Netlify Previews (Open PRs)

on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch: {}

jobs:
  list-open-prs:
    name: List open PRs
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.collect.outputs.prs }}
    steps:
      - name: Collect open PR numbers
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            // Exclude drafts if desired; currently include all open PRs
            const prNumbers = prs.map(pr => pr.number);
            core.setOutput('prs', JSON.stringify(prNumbers));

  rebuild:
    name: Rebuild PR #${{ matrix.pr }} preview
    needs: list-open-prs
    if: needs.list-open-prs.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.list-open-prs.outputs.prs) }}
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ matrix.pr }}/merge

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci && npm ci --prefix shared && npm ci --prefix web

      - name: Build web
        run: |
          npm run build --prefix web

      - name: Deploy to Netlify (PR ${{ matrix.pr }})
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './web/dist'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Scheduled refresh for PR #${{ matrix.pr }}'
          alias: deploy-preview-${{ matrix.pr }}
          netlify-config-path: ./web/netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

